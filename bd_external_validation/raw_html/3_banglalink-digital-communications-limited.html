: 18px;\"\u003eBy visiting or using this website you agree to comply with the following terms and conditions If you have any query regarding the terms and condition, Please write to: \u003c/span\u003e\u003ca href=\"http://info@banglalink.net\" target=\"_blank\"\u003e\u003cspan style=\"font-size: 18px;\"\u003einfo@banglalink.net\u003c/span\u003e\u003c/a\u003e\u003c/b\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 1rem;\"\u003eYou understand and acknowledge that all copyright, service marks, trademarks, trade and intellectual property names of Banglalink digital communications limited (“Banglalink”) (collectively, the “marks”), including but not limited to Banglalink, power tools, ask star, are the exclusive property of Banglalink, and you shall not use any of the marks without Banglalink ’s prior written approval.\u003c/span\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003eThe content of this website is produced by Banglalink, or under its instructions all intellectual property rights in respect of the content vest with Banglalink, you may not therefore copy or reproduce the same without Banglalink’s prior written permission.\u003c/li\u003e\u003cli\u003eBanglalink does not represent or warrant that the content of this website is error free or suitable for any particular purpose. Banglalink accordingly shall not be liable to any person who may rely on any such content and/or who may suffer any kind of loss due to this reliance. Banglalink, shall also not be liable in respect of any other information which may be accessed through this website\u003c/li\u003e\u003cli\u003eA this web page is a public resource of general information that is intended, but not promised or guaranteed, to be correct, complete and up-to-date. However, this web page is not intended to be a source of advertising, solicitation, or legal advice; and this should not rely on information provided herein and should always seek the advice of competent counsel in the reader’s or endorsements of the linked entities. The use of the internet e-mail for confidential or sensitive information is discouraged.\u003c/li\u003e\u003cli\u003eCertain information and/ services mentioned herein may not be accessible to you if your pc does not support the relevant technology.\u003c/li\u003e\u003cli\u003eAny information submitted by you (including any personal information) may be used and/or published by Banglalink at its entire discretion, in any form whatsoever – including to track your usage of the website and to send messages/information. You undertake that such information shall be accurate, and you take responsibility for any loss, harm, damage, expense, cost that Banglalink, may suffer in case such information is inaccurate.\u003c/li\u003e\u003cli\u003eIf Banglalink, suffers loss in respect of any transaction requested by you through this website Banglalink, shall have the right to indemnification from yourself and you undertake to indemnify and hold Banglalink, harmless in respect of such loss.\u003c/li\u003e\u003cli\u003eAny person causing nuisance, inconvenience, defamation or other illegal activities by using this website shall be liable to Banglalink and to its customers (as the case may be) – however in no event shall Banglalink be liable in respect of such nuisance, inconvenience, defamation or other illegal activities.\u003c/li\u003e\u003cli\u003eBanglalink, shall not be liable for any loss, harm, damage, cost, expense (whether direct or indirect) which may be incurred by any person on account of (i) Any thing contained in or accessible through this website or (ii) SMS chat or (iii) Any other services provided by Banglalink.\u003c/li\u003e\u003cli\u003eBanglalink, reserves the right to discontinue or suspend this website at any time without notice, and also to amend these terms and conditions at its own discretion without prior notice.\u003c/li\u003e\u003cli\u003eBanglalink at its discretion may block access to any visitor for a part or whole of the website for any period without any disclosure in this regard.\u003c/li\u003e\u003cli\u003eThese terms and condition shall be governed and interpreted in accordance with the laws of Bangladesh and you consent to the non-exclusive jurisdiction of Bangladesh courts.\u003c/li\u003e\u003c/ul\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1426,"componentType":"title_text_editor","title":"Privacy Policy","content":"\u003cp\u003eBanglalink has adopted this privacy policy to inform you how any personal information that Banglalink collects during your visit of the web site will be used. Banglalink will take all steps reasonably necessary to ensure that your data is treated securely and in accordance with this privacy policy.\u003c/p\u003e\u003cp\u003eWhen visitors visit this website, we record their internet protocol address (“IP Address) and other related information. With an IP Address we can track their use of this website. Use tracked includes the pages most frequently requested, the number of requests per page, the type of browser used by the visitor, the type of operating system in use by the visitor and the domain name of the visitor's internet service provider.\u003c/p\u003e\u003cp\u003eThis information is primarily used to provide an enhanced online experience for the visitor. For example, by having this information, web pages optimized for a particular visitor's computer are automatically made available to that visitor. Other use of this information may include the identification of problems with our servers, to administer our web site, to monitor traffic within the web site, to prevent fraud and the internal review of the number of visitors to this web site, in an aggregated and non-personally-identifiable form. We retain this information for a maximum period of 30 days or for a period required by the Law Enforcing Agencies (LEA).\u003c/p\u003e\u003cp\u003eCookies: The web site uses \"cookie\" technology to provide an enhanced online experience. We refer to our Cookie Policy for specific information regarding the use of cookies.\u003c/p\u003e\u003cp\u003eVisitors to this web site may be asked to voluntarily supply certain personally identifying information such as e-mail addresses, postal addresses and phone numbers for the purpose of authentication of the user. Such personally identifiable data about visitors to this web site are known to Banglalink only when voluntarily submitted by the visitors.\u003c/p\u003e\u003cp\u003eBanglalink will only use personally identifiable data provided at this web site for the purposes described in this policy or at the time it is collected, (for example, the e-mail addresses visitors provide in order to receive e-mail alerts will only be used to send these e-mail alerts).\u003c/p\u003e\u003cp\u003eE-mail: From time to time, Banglalink may use your personal information to contact you by e-mail to inform you about our services. These communications are intended to inform you of services provided by Banglalink. Visitors may opt-out of any opt-in alerts to which they have subscribed by selecting the unsubscribe option, which will be included in each e-mail alert.\u003c/p\u003e\u003cp\u003eThird parties: Banglalink may share the name, address, phone number and e-mail address provided by you with third-party business partners only to provide you with the services or additional information about Banglalink that you have requested (e.g. sending targeted e-mails, fulfilling information requests and conducting surveys on behalf of Banglalink). Furthermore, Banglalink may appoint third parties to perform maintenance to this website with appropriate permission, if applicable. These parties may be located in countries outside Bangladesh.\u003c/p\u003e\u003cp\u003eAny third-party web sites to which Banglalink may link, may have different privacy policies and practices. Please carefully review these other web sites' privacy policies in order to determine how each web site may use any personal information you provide. Banglalink cannot guarantee that these third-parties will grant you similar level of data protection as we do on this website.\u003c/p\u003e\u003cp\u003eWe value your privacy and are committed to protecting your personal data. You have the right to\u0026nbsp;\u003c/p\u003e\u003cp\u003eplace a request for the deletion of your data which you provided during registration. To delete\u0026nbsp;\u003c/p\u003e\u003cp\u003eyour personal data, kindly proceed with the following steps:\u0026nbsp;\u003c/p\u003e\u003cp\u003eNavigate to the Edit Profile Section.\u003c/p\u003e\u003cp\u003e➢ Edit/remove the information you wish to delete;\u003c/p\u003e\u003cp\u003e➢ To remove all personal data, select \"Delete Account\" in “Edit Profile” Section and follow\u0026nbsp;\u003c/p\u003e\u003cp\u003ethe prompts to complete the process.\u003c/p\u003e\u003cp\u003eOnce your deletion request is verified and processed, we will delete your personal data using\u0026nbsp;\u003c/p\u003e\u003cp\u003esecure methods to prevent unauthorized access or disclosure. This includes:\u003c/p\u003e\u003cp\u003e- Removing all identifiable information from our active databases\u003c/p\u003e\u003cp\u003e- Once a user account is deleted, Banglalink doesn’t have any traceability matrix to retain any\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003edata of any users.\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 1rem;\"\u003eBanglalink reserves the right to change, update or modify this policy at any time at our sole discretion, and will post any new privacy policy here. Any such change, update or modification will take effect as soon as it is posted on the web site. Use of information gathered by Banglalink will be subject to the privacy policy in effect at the time of use. In case the changes relate to Banglalink’s use of cookies, you will be requested to accept the updated cookie policy before entering this web site. Please be aware that it is your own responsibility for checking our web site frequently in order to keep informed of recent changes. By using or navigating around the web site or utilising any of the services we provide here, you confirm that you have read, fully understood and agreed to be bound by this privacy policy.\u003c/span\u003e\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-ce\u003c/span\u003e\u003c/style\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1427,"componentType":"title_text_editor","title":"Cookies:","content":"\u003cp\u003eIn this policy you will find information on internet cookies, the cookies that may be set when you visit the web site of Banglalink Digital Communications Limited, (hereinafter referred as “Banglalink” with its address at Tiger’s Den, House 4 (SW), Bir Uttam Mir Shawkat Sarak, Gulshan1, Dhaka 1212, Bangladesh) and how to manage and delete these through your browser.\u003c/p\u003e\u003cp\u003eBy accepting the notice, you will accept the cookies for this \u003ca href=\"http://www.banglalink.net\" target=\"_blank\"\u003ewww.banglalink.net\u003c/a\u003e website.\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1428,"componentType":"title_text_editor","title":"What is a cookie and how does it work?","content":"A cookie is a small amount of data, which often includes a unique identifier that is sent to your computer, tablet or mobile phone (referred to here as a \"device\") browser from a web site's server and is stored on your device's hard drive. The cookie will be sent back to the server at your next visit of the web site. The web site will then recognise your specific browser-device combination. Many web sites do this because cookies enable web site publishers to find out whether the device (and probably its user) has visited the web site before and to tailor the web site to the users’ preferences (such as language).\u003cbr\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1429,"componentType":"title_text_editor","title":"Types of cookies","content":"\u003cp\u003e\u003c/p\u003e\u003cp\u003eBefore we explain how we use cookies on our web site, we first explain what types of cookies are generally used on web sites. Functional cookies are distinguished from other cookies. Banglalink asks your permission for the use of other than functional cookies.\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 1rem;\"\u003eFunctional cookies are cookies that are necessary for the optimal functionality of a web site. These cookies\u003c/span\u003e\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the sole purpose of carrying out the transmission of communication over an electronic network or\u003c/li\u003e\u003cli\u003eAre strictly necessary for the provision of an information service requested by the user. Examples include cookies that remember the items in an online shopping basket, or cookies that can remember login details.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOther cookies can be separated in analytic cookies and tracking cookies.\u003c/p\u003e\u003cp\u003eAnalytic cookies are cookies that collect anonymous statistical information on the use of the web site in order to improve a web site’s functionality. Examples include cookies that collect information on the number of visitors to a web site, or the amount of time that a visitor spends on a web site.\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 1rem;\"\u003eNo tracking cookies are used.\u003c/span\u003e\u003cbr\u003e\u003c/p\u003e\u003cstyle type=\"text/css\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 1rem;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 1rem;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1431,"componentType":"title_text_editor","title":"How do we use cookies?","content":"\u003cdiv\u003e﻿During the course of any visit to the Banglalink web site, the pages you see, along with any cookies, are downloaded to your device. Banglalink asks your permission for other than functional cookies. Banglalink uses the following cookies:\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cp\u003e1. Functional cookies. Our web site uses cookies for optimal functionality of our web site and for the following purposes:\u003c/p\u003e\u003cul\u003e\u003cli\u003eRemembering a user’s preferences, such as language\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e2. Analytic cookies. Our web site uses cookies in order to assess what parts of our web site are most interesting to our users. Our web site uses analytic cookies for the following purposes:\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003eCalculating the number of visitors to our web sites\u003c/li\u003e\u003cli\u003eUnderstanding the types of content viewed and documents downloaded\u003c/li\u003e\u003cli\u003eMonitoring web site error\u003c/li\u003e\u003c/ul\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1432,"componentType":"title_text_editor","title":"How to manage and delete cookies","content":"\u003cp\u003eIf you wish to restrict or block the cookies which are set by the Banglalink web site, or indeed any other web site, you can do this through your browser settings. Each web site can send its own cookie to your browser if your browser's preferences allow it, but (to protect your privacy) your browser only permits a web site to access the cookies it has already sent to you, not the cookies sent to you by other web sites. Many web sites do this whenever a user visits their web site in order to track online traffic flows.\u003c/p\u003e\u003cp\u003eUsers have the opportunity to set their devices to accept all cookies, to notify them when a cookie is issued, or not to receive cookies at any time. Click on the relevant link for your browser to see the instructions.\u003c/p\u003e\u003cp\u003eFor information on how to do this on the browser of your mobile phone you will need to refer to your handset manual.\u003c/p\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1433,"componentType":"title_text_editor","title":"Final remarks","content":"Banglalink may need to amend this cookie statement from time to time, for example if our web site or legislation changes.","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]}]},"bn":{"heroTitle":"লিগ্যাল","heroDescription":"নিম্নলিখিত শর্তসমূহ মেনে চলার সম্মতি দিন","heroImage":"https://web-api.banglalink.net/uploads/assetlite/images/al_banners/ZF0b2dXmZzmuwqf57Sv8my3LM70rNmR1tTIMSunp.png","heroAltText":"","metaContent":"","metaSchema":"","components":[{"id":1423,"componentType":"title_text_editor","title":"","content":"\u003cdiv\u003e\u003cb\u003e\u003cspan style=\"font-size: 18px;\"\u003eনিম্নলিখিত শর্তসমূহ মেনে চলার সম্মতি দিয়েই আপনি এই ওয়েবসাইট ভিজিট করা কিংবা ব্যবহার করছেন। শর্তসমূহ সম্পর্কে যেকোনো জিজ্ঞাসার জন্য ই-মেইল পাঠান: \u003c/span\u003e\u003ca href=\"http://info@banglalink.net\" target=\"_blank\"\u003e\u003cspan style=\"font-size: 18px;\"\u003einfo@banglalink.net\u003c/span\u003e\u003c/a\u003e\u003c/b\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 1rem;\"\u003eআপনি জানেন এবং অবগত আছেন যে সকল প্রকার কপিরাইট, সার্ভিস মার্কস, ট্রেডমার্কস, ট্রেড, ইন্টেলেকচুয়াল প্রোপার্টি বাংলালিংক ডিজিটাল কমিউনিকেশনস লিমিটেড (বাংলালিংক) (একীভূতভাবে সকল প্রতীক) এর নামে, পাওয়ার টুলস, আস্ক স্টার ইত্যাদি আলাদাভাবে শুধু বাংলালিংক এর সম্পত্তি। কোনো প্রকার পূর্ব লিখিত অনুমতি ব্যতীরেকে কেউ এইসব কোনোভাবেই ব্যবহার করতে পারবে না।\u003c/span\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003eএই ওয়েবসাইটের প্রতিটি বিষয়বস্তু এবং সবকিছুই এর ইন্টেলেকচুয়াল প্রোপার্টি হিসেবে স্বীকৃত, ফলে পূর্ব অনুমতি ব্যতীত এর কোনোকিছুই অনুলিপি কিংবা পুনঃলিখন করা যাবে না।\u003c/li\u003e\u003cli\u003eবাংলালিংক এই মর্মে কোনো ওয়ারেন্টি দিচ্ছে না যে এই ওয়েবসাইটের সব তথ্যই নির্ভুল এবং যেকোনো নির্দিষ্ট প্রয়োজনেই কাজে লাগবে। এক্ষেত্রে কেউ যদি এই ওয়েবসাইটের কোনো তথ্য ব্যবহার করে থাকেন তার জন্য বাংলালিংক দায়ভার বহন করবে না। এই ওয়েবসাইটের মাধ্যমে যেসব তথ্য সরবরাহ করা হচ্ছে, বাংলালিংক সেগুলোর জন্য কোনোপ্রকার দায়ভার গ্রহণ করবে না।\u003c/li\u003e\u003cli\u003eএই ওয়েবসাইটের বিষয়বস্তু কেবলমাত্র সাধারণ তথ্যের জন্য, এখানে আমরা কোনো প্রকার নির্ভুল তথ্য, সম্পূর্ণ তথ্য কিংবা আপডেটেড তথ্যের প্রতিজ্ঞা করছি না বা কোনো প্রকার গ্যারান্টি দিচ্ছি না। এছাড়াও এ ওয়েবপেইজটি কোনো বিজ্ঞাপনের, প্রার্থনা কিংবা আইনি বিষয়ের তথ্যের উৎস নয়। এখানকার তথ্যের উপর নির্ভর করা উচিত নয় এবং সবসময় পাঠকদের বিশেষজ্ঞদের পরামর্শ নেয়া আবশ্যক। গোপনীয় ও সংবেদনশীল তথ্যের ক্ষেত্রে ইন্টারনেট ই-মেইল ব্যবহারের ব্যাপারে আমরা নিরুৎসাহিত করি।\u003c/li\u003e\u003cli\u003eএখানকার কিছু কিছু তথ্য বা সেবা আপনি হয়তো অ্যাকসেস করতে পারবেন না যদি আপনার কম্পিউটার সেটা সাপোর্ট না করে।\u003c/li\u003e\u003cli\u003eআপনার দেয়া যেকোনো তথ্য (যেকোনো ব্যক্তিগত তথ্যও) যা আপনি নিজে জমা দিয়েছেন তা যেকোনো প্রয়োজনে বাংলালিংক ব্যবহার করতে, প্রকাশ করতে পারবে। সেটা আপনার ওয়েবসাইটে ভিজিট করা থেকে শুরু করে আপনাকে কোনো তথ্য জানানোর জন্যও হতে পারে। আপনাকেই নিশ্চিত করতে হবে যে তথ্যগুলো সঠিক। অন্যথায় ভুল তথ্যের কারণে কোনো প্রকার ক্ষতি, সমস্যা, খরচপাতি ইত্যাদির জন্য আপনাকেই দায়িত্ব নিতে হবে।\u003c/li\u003e\u003cli\u003eএই ওয়েবসাইটের মাধ্যমে আপনার কোনো অনুরোধের কারণে বাংলালিংক যদি কোনো প্রকার ক্ষয়-ক্ষতির শিকার হয় সেক্ষেত্রে এর দায়ভার আপনাকেই বহন করতে হবে।\u003c/li\u003e\u003cli\u003eকোনো ব্যক্তি যদি এই ওয়েবসাইটের মাধ্যমে কোনো প্রকার ক্ষয়-ক্ষতি, উৎপাত কিংবা অন্য কোনো অবৈধ কার্যকলাপে লিপ্ত হন তাহলে ঐ ব্যক্তি বাংলালিংক-এর কাছে দায়বদ্ধ থাকবেন। এবং কোনো ব্যক্তির কারণে এ ধরনের কোনো ঘটনার জন্য বাংলালিংক কোনোভাবেই দায়বদ্ধ হবে না।\u003c/li\u003e\u003cli\u003eকোনো ব্যক্তির (i) ওয়েবসাইটে অবৈধ বিচরণের ফলে (ii) এসএমএস চ্যাট কিংবা বাংলালিংক কর্তৃক সরবরাহকৃত অন্য কোনো সেবার মাধ্যমে যদি প্রত্যক্ষ কিংবা পরোক্ষভাবে কারো অনিষ্ট সাধন করেন, ক্ষতি করেন, কারো খরচ বাড়িয়ে দেন, তার জন্য বাংলালিংক কোনোভাবেই দায়বদ্ধ থাকবে না।\u003c/li\u003e\u003cli\u003eকোনো পূর্ব ঘোষণা ব্যতীরেকেই যেকোনো সময় বাংলালিংক এই ওয়েবসাইট বন্ধ করে দেয়ার কিংবা সংশোধন করে দেয়ার অধিকার সংরক্ষণ করে। এবং কোনো পূর্ব ঘোষণা ব্যতীত এর শর্তসমূহও পরিবর্তন করার অধিকার রাখে বাংলালিংক।\u003c/li\u003e\u003cli\u003eবাংলালিংক সম্পূর্ণ নিজস্ব বিবেচনায় কোনো পূর্ব ঘোষণা ছাড়াই এই ওয়েবসাইটের আংশিক কিংবা সম্পূর্ণ অংশ কোনো দর্শনার্থীর ভিজিট করার ক্ষেত্রে ব্লক করে দিতে পারেন।\u003c/li\u003e\u003cli\u003eএই শর্তসমূহ বাংলাদেশের আইন অনুযায়ী প্রয়োগ করা হবে এবং নন-এক্সক্লুসিভ জুরিসডিকশন অব বাংলাদেশ কোর্ট অনুযায়ী পরিচালিত হবে।\u003c/li\u003e\u003c/ul\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1426,"componentType":"title_text_editor","title":"নিরাপত্তা শর্তাবলি:","content":"\u003cdiv\u003eআমরা ব্যক্তিগত ও গোপনীয় তথ্য প্রদানকে নিরুৎসাহিত করি। কিন্ত কোনো কোনো ক্ষেত্রে যখন কোনো সেবার জন্য কারো ব্যক্তিগত গোপনীয় তথ্যের প্রয়োজন হয় তখন ঐ তথ্য বাংলালিংক এর প্রাইভেসি পলিসি অনুযায়ী বিবেচনা করা হবে।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eযখন কেউ ওয়েবসাইট ভিজিট করে, আমরা তাদের ইন্টারনেট প্রোটোকল অ্যাড্রেস (IP Address) এবং এ সম্পর্কিত অন্য সকল তথ্যাবলী রেকর্ড করে রাখি। আইপি অ্যাড্রেস-এর সহায়তায় আমরা তাদের এই ওয়েবসাইটের ব্যবহার ট্র্যাক করতে পারি। এর মাধ্যমে আমরা জানতে পারি কোন পেইজ-এর জন্য সব থেকে বেশি অনুরোধ করা হয়েছে, প্রতি পেইজ-এর অনুরোধ সংখ্যা কতো, ভিজিটর কোন ওয়েব ব্রাউজার ব্যবহার করে, ভিজিটর কোন অপারেটিং সিস্টেম ব্যবহার করে এবং ভিজিটরের ইন্টারনেট সার্ভিস প্রোভাইডারের ডোমেইন নাম কী।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eপ্রাথমিকভাবে ভিজিটরকে উন্নত অনলাইন অভিজ্ঞতা দেয়ার জন্য এই সকল তথ্য ব্যবহার করা হয়। যেমন, এই তথ্য থাকার কারণে, একজন নির্দিষ্ট ভিজিটরের কম্পিউটারের জন্য অপ্টিমাইজ করা ওয়েবপেইজ সরাসরি সেই ভিজিটরের কাছে চলে আসবে। এই তথ্যের অন্যান্য ব্যবহারের মধ্যে আছে আমাদের সার্ভারের বিভিন্ন সমস্যা সনাক্ত করা, আমাদের ওয়েবসাইট পরিচালনা করা, ওয়েবসাইটের ট্রাফিক নিয়ন্ত্রণ করা, প্রতারণা প্রতিরোধ করা এবং সমষ্টিগতভাবে ওয়েবসাইটের ভিজিটরদের সংখ্যার অভ্যন্তরীণ যাচাই করা যা ব্যক্তিগতভাবে সনাক্তকরণ সম্ভব নয়। আমরা এই তথ্য সর্বোচ্চ ৩০ দিন অথবা আইন প্রয়োগকারী সংস্থা কর্তৃক নির্ধারিত সময়সীমা পর্যন্ত রাখি।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eকুকিজ: ওয়েবসাইট “কুকি” প্রযুক্তি ব্যবহার করে ব্যবহারকারীকে উন্নত অনলাইন অভিজ্ঞতা দেয়ার জন্য। কুকির ব্যবহারসহ কিছু নির্দিষ্ট তথ্যের জন্য আমরা কুকি পলিসি নির্দেশ করি।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eএই ওয়েবসাইটের ভিজিটরদের কাছে স্বেচ্ছায় প্রদানের জন্য ই-মেইল, পোস্টাল ঠিকানা এবং ফোন নম্বর এমন কয়েকটি ব্যক্তিগত তথ্য চাওয়া হবে ব্যবহারকারীর সত্যতা যাচাই করার জন্য। ওয়েবসাইটে প্রদত্ত ভিজিটরের এই সকল ব্যক্তিগত তথ্য শুধুমাত্র তখনই বাংলালিংক-এর কাছে পৌছাবে যখন তা ভিজিটর স্বেচ্ছায় জমা দিবে।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eবাংলালিংক ওয়েবসাইটে প্রদত্ত এই সকল ব্যক্তিগত তথ্য শুধুমাত্র এই শর্তাবলিতে বর্ণিত উদ্দেশ্যেই অথবা যখন সংগৃহীত হবে তখনই ব্যবহার করবে (যেমন, ভিজিটর ই-মেইল অ্যালার্ট পাওয়ার জন্য যে ই-মেইল অ্যাড্রেস দিবে তা শুধুমাত্র ই-মেইল অ্যালার্ট পাঠানোর জন্যই ব্যবহৃত হবে)।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eই-মেইল: আমাদের বিভিন্ন সার্ভিসের ব্যাপারে জানাতে বাংলালিংক বিভিন্ন সময়ে আপনাকে ই-মেইল করতে পারে। এই যোগাযোগের উদ্দেশ্য শুধুমাত্র আপনাকে বাংলালিংক-এর বিভিন্ন সেবার ব্যাপারে অবগত করা। ভিজিটররা যেকোনো সময় আনসাবস্ক্রাইব অপশন নির্বাচন করে সাবস্ক্রাইব করা অ্যালার্ট বন্ধ করতে পারবে, যা প্রতিটি ই-মেইল অ্যালার্টে দেয়া থাকে।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eতৃতীয় পক্ষ: আপনার অনুরোধকৃত কোনো সার্ভিস অথবা তথ্য আপনার পর্যন্ত পৌঁছাতে বাংলালিংক আপনার সরবরাহকৃত নাম, ঠিকানা, ফোন নম্বর এবং ই-মেইল কোনো থার্ড পার্টি অথবা ব্যবসায়িক অংশীদারের সাথে শেয়ার করতে পারে (যেমন, টার্গেটেড ই-মেইল পাঠানো, তথ্য প্রাপ্তির অনুরোধ রক্ষা করা এবং বাংলালিংক-এর পক্ষে বিভিন্ন জরিপ চালানো)। এছাড়াও, বাংলালিংক ওয়েবসাইটের রক্ষণাবেক্ষণের জন্যেও উপযুক্ত নিয়ন্ত্রকের/কর্তৃপক্ষের অনুমতি প্রাপ্তি সাপেক্ষে তৃতীয় পক্ষের সাহায্য নিতে পারে। এই সকল তৃতীয় পক্ষ বাংলাদেশের অভ্যন্তরে অথবা বাইরে অবস্থিত হতে পারে।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eযেকোনো তৃতীয় পক্ষের ওয়েবসাইট যেটির সাথে বাংলালিংক-এর সংযোগ আছে, তার পৃথক কোনো গোপনীয়তা নীতিমালা এবং নিয়ম থাকতে পারে। এই প্রতিটি ওয়েবসাইট কিভাবে আপনার ব্যক্তিগত তথ্য ব্যবহার করতে পারে তা জানার জন্য সতর্কতার সাথে তাদের গোপনীয়তা নীতিমালা পড়ে দেখুন। আমরা আমাদের ওয়েবসাইটে যে ধরনের ডাটা সুরক্ষা দিয়ে থাকি এই সকল থার্ড পার্টি সেটি দিতে সক্ষম কিনা বাংলালিংক তার নিশ্চয়তা দিবে না।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eবাংলালিংক যেকোনো সময়ে এই সকল শর্তাবলি পরিবর্তন, হালনাগাদ অথবা রূপান্তর করার অধিকার রাখে এবং যেকোনো নতুন শর্তাবলি এখানে জানিয়ে দেওয়া হবে। এরকম যেকোনো পরিবর্তন, হালনাগাদ অথবা রূপান্তর যে সময়ে ওয়েবসাইটে উল্লেখিত হবে, তার সাথে সাথেই কার্যকর হবে। বাংলালিংক-এর সংগৃহীত তথ্যাবলী যে সময়ে ব্যবহার হচ্ছে সেই সময়ের গোপনীয়তা নীতিমালা অনুযায়ী ব্যবহৃত হবে। যদি এই সকল পরিবর্তন বাংলালিংক-এর কুকি ব্যবহার সম্পর্কিত হয়, তাহলে ওয়েবসাইটে প্রবেশের আগে হালানাগাদকৃত কুকি পলিসি সমর্থনের জন্য আপনাকে অনুরোধ করা হবে। অনুগ্রহপূর্বক আমাদের ওয়েবসাইটের বিভিন্ন নতুন পরিবর্তনের ব্যাপারে জানার জন্যে নিজ দায়িত্বে প্রতিনিয়ত ওয়েবসাইট ভিজিট করুন। আমাদের ওয়েবসাইট ব্যবহার করে অথবা ওয়েবসাইটে ন্যাভিগেট করে অথবা ওয়েবসাইট প্রদত্ত কোনো সার্ভিস ব্যবহার করে আপনি সম্মতি জানাচ্ছেন যে আপনি এই নিরাপত্তা শর্তাবলি সম্পূর্ণ পড়েছেন, বুঝেছেন এবং এর সাথে একমত হয়েছেন।\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1427,"componentType":"title_text_editor","title":"কুকিজ:","content":"\u003cp\u003eএই নীতিমালায় আপনি ইন্টারনেট কুকিজ সম্পর্কিত তথ্য পাবেন, যেই কুকিজগুলো বাংলালিংক ডিজিটাল কমিউনিকেশনস লিমিটেডের ওয়েবসাইটটিতে গেলে সেট হতে পারে (পরবর্তীতে উল্লেখিত “বাংলালিংক”- ঠিকানা টাইগার্স ডেন, হাউস ৪(এসডব্লিউ), বীর উত্তম মীর শওকত সড়ক, গুলশান ১, ঢাকা ১২১২, বাংলাদেশ) এবং কীভাবে আপনার ব্রাউজারের মাধ্যমে কুকিজ পরিচালনা করবেন এবং মুছে ফেলবেন জানতে পারবেন।\u003c/p\u003e\u003cp\u003eনোটিশটিতে সম্মতি দিয়ে, আপনি\u003ca href=\"http://www.banglalink.net\" target=\"_blank\"\u003e www.banglalink.net\u003c/a\u003e ওয়েবসাইটের কুকিজগুলো গ্রহণ করে নিলেন।\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cp\u003e\u003cstyle type=\"text/css\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/style\u003e\u003c/p\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1428,"componentType":"title_text_editor","title":"কুকিজ কী এবং এটি কীভাবে কাজ করে?","content":"\u003cp\u003eকুকিজ হচ্ছে অল্প পরিমাণে ডাটা, যা সনাক্তকারী হিসেবে আপনার কম্পিউটার, ট্যাব বা মোবাইল ফোনে (এখানে \"ডিভাইস\" হিসাবে উল্লেখ করা হয়েছে) কোনো ওয়েবসাইটের সার্ভার থেকে প্রেরণ করা হয় এবং আপনার ডিভাইসের হার্ড ড্রাইভে জমা থাকে। ওয়েবসাইটে আপনার পরবর্তী ভিজিটের পরে কুকিটি আবার সার্ভারে পাঠিয়ে দেয়া হবে। এরপর ওয়েবসাইটটি আপনাকে সনাক্ত করবে একটি নির্দিষ্ট ব্রাউজার-ডিভাইসের কম্বিনেশন হিসেবে। অনেকগুলি ওয়েবসাইট এটি করে, কারণ কুকিজ ওয়েবসাইটটিতে আগে ভিজিট করেছিলো কিনা সেটি জানতে এবং ব্যবহারকারীদের পছন্দ অনুযায়ী (যেমন ভাষা) ওয়েবসাইটটিকে উপযোগী করতে সহায়তা করে।\u003c/p\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1429,"componentType":"title_text_editor","title":"কুকিজের প্রকারভেদ:","content":"\u003cp\u003eআমাদের ওয়েবসাইটে কিভাবে কুকিজ ব্যবহার করবো তা ব্যাখ্যা করার আগে, আমরা প্রথমেই ব্যাখ্যা করবো ওয়েবসাইটে সাধারণত কী ধরনের কুকিজ ব্যবহার করা হয়। ফাংশনাল কুকিগুলো অন্যান্য কুকিজ থেকে আলাদা। বাংলালিংক ফাংশনাল কুকিজ ছাড়া অন্য ব্যবহারে আপনার অনুমতি চাইবে।\u003c/p\u003e\u003cp\u003eফাংশনাল কুকিজগুলি এমন কুকিজ যা কোনো ওয়েবসাইটের সন্তোষজনক কর্মকান্ড পরিচালনার জন্য প্রয়োজনীয়। এই কুকিজগুলোর\u003c/p\u003e\u003cul\u003e\u003cli\u003eএকমাত্র উদ্দেশ্য বৈদ্যুতিক নেটওয়ার্কে সঞ্চালনার মাধ্যমে যোগাযোগ পরিচালনা করা বা\u003c/li\u003e\u003cli\u003eব্যবহারকারীদের অনুরোধে তথ্যগুলোর সঠিকভাবে ব্যবস্থাপনা করা। উদাহরণস্বরূপ উল্লেখ করা যেতে পারে, সেইসব কুকিজ যেগুলো অনলাইন শপিং বাস্কেট এর আইটেমসমূহ মনে রাখে অথবা সেসব কুকিজ যেগুলো লগ-ইন ডিটেইলস মনে রাখে।\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 1rem;\"\u003eঅন্যান্য কুকিজগুলো অ্যানালিটিক কুকি এবং ট্র্যাকিং কুকি হিসেবে পৃথক করা যাবে।\u003c/span\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eঅ্যানালিটিক কুকিজ হচ্ছে এমন কুকি যেগুলো বেনামে বিভিন্ন পরিসংখ্যান তথ্য ওয়েবসাইটের ব্যবহারের সময় সংগ্রহ করে যা ওয়েবসাইটের ব্যবহার উপযোগিতা বাড়ানোর জন্য ব্যবহৃত হয়। উদাহরণস্বরূপ সেসব কুকি, যা কোনো ওয়েবসাইটের ভিজিটরের সংখ্যা সম্পর্কিত তথ্য সংগ্রহ করে, অথবা কত সময় একজন ভিজিটর কোন ওয়েবসাইটে ব্যয় করে।\u003c/p\u003e\u003cp\u003eকোনো ট্র্যাকিং কুকি ব্যবহৃত হয় না।\u003c/p\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1431,"componentType":"title_text_editor","title":"আমরা কীভাবে কুকিজ ব্যবহার করি:","content":"\u003cp\u003eবাংলালিংক ওয়েবসাইটে ভিজিটের সময় যে সমস্ত পেজ এবং সেই সাথে যে সকল কুকিজ আপনি দেখবেন সেগুলো আপনার ডিভাইসে ডাউনলোড হয়ে যাবে। ফাংশনাল কুকি ব্যতীত অন্য যেকোনো কুকি ডাউনলোডের জন্যে বাংলালিংক আপনার অনুমতি নিবে। বাংলালিংক নিম্নবর্ণিত কুকিজ ব্যবহার করে:\u003c/p\u003e\u003cp\u003e১। ফাংশনাল কুকিজ। আমাদের ওয়েবসাইট কুকিজ ব্যবহার করে ওয়েবসাইটের কার্যকরিতা সর্বাপেক্ষা বৃদ্ধির জন্যে এবং নিম্নবর্ণিত কারণে:\u003c/p\u003e\u003cul\u003e\u003cli\u003eব্যবহারকারীর পছন্দ মনে রাখার জন্য, যেমন ভাষা\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e২। অ্যানালিটিক কুকিজ। আমাদের ওয়েবসাইট কুকিজ ব্যবহার করে, ব্যবহারকারীরা ওয়েবসাইটের কোন অংশ সব থেকে বেশি পছন্দ করে তা নির্ধারণ করার জন্যে। আমাদের ওয়েবসাইট অ্যানালিটিক কুকিজ নিম্নবর্ণিত উদ্দেশ্যে ব্যবহার করে:\u003c/p\u003e\u003cul\u003e\u003cli\u003eওয়েবসাইটের ভিজিটর সংখ্যা হিসাবের জন্যে\u003c/li\u003e\u003cli\u003eকোন ধরনের কন্টেন্ট বেশি দেখা হয় এবং কোন ধরনের ডকুমেন্ট ডাউনলোড হয় তা বোঝার জন্যে\u003c/li\u003e\u003cli\u003eওয়েবসাইটের বিভিন্ন ত্রুটি সনাক্ত করা\u003c/li\u003e\u003c/ul\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e\u003cstyle type=\"text/css\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003etd {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;}\u003c/span\u003e\u003c/style\u003e","video":"","image":"/placeholder.png","alt_img":"","otherAttributes":null,"items":[]},{"id":1432,"componentType":"title_text_editor","title":"কিভাবে কুকিজ পরিচালনা ও ডিলিট করবেন:","content":"\u003cp\u003eআপনি যদি বাংলালিংক অথবা অন্য কোনো ওয়েবসাইটের সেট করা কুকিজ ব্লক অথবা রেস্ট্রিক্ট করতে চান, তবে তা আপনার ব্রাউজারের সেটিংস-এ গিয়ে করতে পারেন। প্রতিটি ওয়েবসাইট আপনার ব্রাউজারে কুকি পাঠাতে পারে যদি আপনার ব্রাউজার তার অনুমতি দেয়, কিন্তু (আপনার নিরাপত্তার জন্য) আপনার ব্রাউজার কোনো ওয়েবসাইটকে শুধুমাত্র তার পাঠানো কুকিজ অ্যাকসেস করতে দেয়, অন্য ওয়েবসাইটের পাঠানো কুকি অ্যাকসেস করতে দেয় না। যখন কেউ সেই ওয়েবসাইট ভিজিট করে, অনেক ওয়েবসাইট অনলাইন ট
