our personal information that you have entrusted to us, we have established privacy policies that defines and enforces the structure and accountability for secure and respectful collection, use and sharing of your personal information\",\"privacy_notice_desc_3\":\"All our activities are underpinned by our T.R.U.S.T principles of being Transparent, respecting your Rights, Using of your personal data, implementing robust cyber Security practices and taking due care when data Transfer is required.\",\"privacy_notice_desc_4\":\"Please take a moment to make yourself familiar with our data privacy practices. Should you have any queries, feel free to reach us at dpo@robi.com.bd\",\"privacy_notice_desc_5\":\"Note that we may from time to time amend, modify, vary or update this Privacy Notice and such updated version shall be available at www.robi.com.bd/en/personal/privacy-notice and you will be bound by such modifications, variations or updates.\",\"information_about_children\":\"Information about Children\",\"information_about_children_desc\":\"If you are under the age of [18], you are required to obtain the consent of your parent, guardian or person who has parental responsibility over you before sending us your personal data (for example, your name, address and email address). In such cases, we may require sufficient proof of such consent at any time.\",\"faqData\":[{\"id\":\"question_1\",\"question\":\"What personal data do we collect?\",\"sections\":[{\"title\":\"The types of personal data we collect or obtain may vary according to our relationship with a data subject (person whose data we collect) and may include the following:\",\"isIntro\":true},{\"title\":\"For Customers\",\"items\":[\"Contact information (such as name, address, email address and telephone number)\",\"Identification information (such as national identification number, passport identification number, national insurance number, tax registration number, social security number, driver's license, date of birth, etc.)\",\"Demographic information (such as age range, marital status, gender etc.)\",\"Photographs, such as those that you may submit for contests or prize-winning competitions\",\"Product specific information (such as preference, closed user groups (CUGs), friends and family who you chose to include in your service plan, credit limit etc.)\",\"Banking information (such as direct debit and related bill payment banking transactions)\",\"Service account information (such as call, data \u0026 other service usage, account balances, transaction history, credit information, billing and loyalty points)\",\"Any footage captured or recorded by our surveillance camera (CCTV) system\"]},{\"title\":\"For Business Partners and Suppliers\",\"items\":[\"contact information (such as name, address, email address and telephone number)\",\"identification information (such as national identification number, passport identification number, national insurance number, tax registration number, social security number, driver's license, date of birth)\",\"business information (such as name of organisation, job title, department, business address)\",\"any footage captured or recorded by our surveillance camera (CCTV) system\"]},{\"title\":\"For Visitors (to any of our premises)\",\"items\":[\"contact information (such as name, address, email address and telephone number)\",\"identification information (such as national identification number, passport identification number, national insurance number, tax registration number, social security number, driver's license, date of birth, etc.)\",\"business information (such as name of organisation, job title, department, business address)\",\"race\",\"nationality\",\"reason for visit\",\"date and time of visit\",\"photograph\",\"biometrics and facial recognition\",\"security notes (special instructions)\"]}]},{\"id\":\"question_2\",\"question\":\"When do we collect your personal data?\",\"sections\":[{\"title\":\"We may collect or obtain your personal data:\",\"isIntro\":true},{\"title\":\"For Customers\",\"items\":[\"when you purchase \u0026 use our network, products and/or services (including through our call centres, walk-in-centre, dealers, and sales channels)\",\"when you contact us or register for information relating to our network, products and/or services or for any other purposes(s)\",\"when you communicate with us (such as IVR, USSD SMS, text messages or other digital channels, emails, questionnaires or surveys)\",\"when you use or interact with any of our digital applications, visit any of our websites or social media pages\",\"when you participate in any of our promotional events, incentives or loyal programs\",\"from external agencies (such as credit reference agencies, screening or investigation agencies)\",\"from our internal database pursuant to your relationship with any member of our group of companies\",\"from our surveillance camera (CCTV) system\"]},{\"title\":\"For Business Partners and Suppliers\",\"items\":[\"when you use our network, products and/or services\",\"when you communicate with us (such as SMS, text messages or other digital channels, emails, questionnaires or surveys)\",\"when you use or interact with any of our digital applications, visit any of our websites or social media pages\",\"from external agencies (such as credit reference agencies, screening or investigation agencies)\",\"from our internal database pursuant to your relationship with any member of our group of companies\",\"from our surveillance camera (CCTV) system\"]},{\"title\":\"For Visitors\",\"items\":[\"when you complete our visitor log book or visitor entry form\",\"when you provide us with your identification document(s)\",\"when you provide your host with information\",\"from our surveillance camera (CCTV) system\"]}]},{\"id\":\"question_3\",\"question\":\"Why do we collect your personal data?\",\"sections\":[{\"title\":\"Your personal data may be used or processed for the purpose of:\",\"isIntro\":true},{\"title\":\"For Customers\",\"items\":[\"providing you with our products, services and/or offers which may be of interest to you\",\"notifying you about benefits and changes to the features of our products and services\",\"providing you with our latest offers, campaigns and promotions (where you subscribe to such updates)\",\"sending you service messages about our subscription or account registration\",\"using your data for participation in our customer surveys or meetings\",\"compliance with laws and legal, contractual and/or regulatory obligations protecting or exercising our legal, contractual and/or regulatory rights and remedies\",\"sending you information via telephone calls, text messages or other digital channels, emails, etc. or social media about products and services offered by selected third parties that we think may interest you\",\"other legitimate purposes\"]},{\"title\":\"For Business Partners and Suppliers\",\"items\":[\"business execution\",\"organisation and management of the business\",\"health, safety and security\",\"compliance with laws and legal, contractual and/or regulatory obligations protecting or exercising our legal, contractual and/or regulatory rights and remedies\",\"protecting our assets and interests\",\"other legitimate purposes\"]},{\"title\":\"For Visitors\",\"items\":[\"health, safety and security\",\"compliance with laws and legal, contractual and/or regulatory obligations protecting or exercising our legal, contractual and/or regulatory rights and remedies\",\"other legitimate purposes\"]}]},{\"id\":\"question_4\",\"question\":\"Who do we disclose your personal data to?\",\"sections\":[{\"title\":\"We may disclose your personal data:\",\"isIntro\":true},{\"title\":\"For Customers\",\"items\":[\"to members of our group companies\",\"to other carriers and operators when routing international calls\",\"to third parties when disclosure is necessary or reasonable to protect our rights, protect your security, investigate fraud or respond to a law enforcement request\",\"to our service providers, field engineers, contractors, subcontractors or any other third-party performing work on our behalf or at our instruction\",\"to our business partners for our marketing activities\",\"to third parties for credit checks and fraud management\",\"to third parties for carrying out analytics to understand how you use our services\",\"to third parties for research and development purposes\",\"to our dealers or agents\",\"to third parties for the purposes set out under \\\"why do we collect your personal data?\\\"\"]},{\"title\":\"For Business Partners and Suppliers\",\"items\":[\"to members of our group of companies\",\"to our third-party agents, service providers, consultants, advisors, contractors and/or subcontractors\",\"to any public authority, governmental, regulatory or fiscal agency where it is necessary to comply with a legal or regulatory obligation to which we are subjected to or as permitted by applicable local law\",\"to third parties for the purposes set out under \\\"why do we collect your personal data\\\"\"]},{\"title\":\"For Visitors\",\"items\":[\"We do not routinely share/transfer your personal data with any external organizations or third parties. However, where and whenever we share/transfer your personal data, it shall be for the purposes set out under \\\"How do we use your personal data?\\\" and we shall do so in accordance with applicable data privacy laws, unless required or permitted by law.\"]},{\"title\":\"\",\"items\":[\"We use reasonable efforts in accordance with industry best practices to ensure that the above-mentioned maintain the confidentiality of your personal data and are restricted from using your personal data for any unauthorised purpose.\"]}]},{\"id\":\"question_5\",\"question\":\"What are your rights?\",\"sections\":[{\"title\":\"We respect your rights and privacy by taking steps to ensure that your personal data is accurate, complete, not misleading and up to date. As a data subject of Robi, you have the following rights:\",\"isIntro\":true},{\"title\":\"Your Rights\",\"items\":[\"Right to be informed\",\"Right to access your personal data\",\"Right to correct/update your personal information you have provided to us\"]},{\"title\":\"How to Exercise Your Rights\",\"items\":[\"You can request to access or update the personal information we hold about you by visiting your nearest Robi Customer Care centers or by digital self-care platforms, e.g., by visiting My Robi App you can access your call details record, your account information etc.\",\"If you wish to visit any customer care centers to access or update your personal information, we may ask you for information to validate your identity and confirm the scope of your request.\",\"Please note that we may not able provide you with access to personal information in certain circumstances, such as where access may be restricted as permitted or required by law.\"]}]},{\"id\":\"question_6\",\"question\":\"Transfers of Personal Data\",\"sections\":[{\"title\":\"We may transfer your personal data across geographical borders to other entities in compliance with law. Where your personal data has been transferred to members of our group of companies and/or to third parties located outside of Bangladesh, the transfer of your personal data is carried out under organizational, contractual and legal measures and with adequate levels of protection implemented as well as any additional local legal requirements for the parties receiving this information in order to safeguard your personal data.\",\"isIntro\":true}]},{\"id\":\"question_7\",\"question\":\"How do we store and protect your personal data?\",\"sections\":[{\"title\":\"We may collect and store your personal data in electronic or physical form, depending upon the requirement. Information may be stored at our and third-party premises within IT Systems (e.g. external cloud storage, internal or third-party management systems, e-mail, database, hard drives), document warehouses etc.\",\"isIntro\":true},{\"title\":\"We endeavour, where practicable, to process your personal data in a safe environment by preventing any unauthorized or unlawful processing of personal data or accidental loss or destruction of, or damage to, such information. We have implemented various physical, technical and administrative security measures to protect your personal data and our network from unauthorized access. Some of these measures include:\",\"items\":[\"encryption of data in transit or at rest\",\"strict adherence to privacy and security practices\",\"periodic security assessment and reviews to upgrade our practices\",\"restriction of access to such data to personnel who have a need to know such data\"]}]},{\"id\":\"question_8\",\"question\":\"How long do we retain your personal data and what are the consequences of not providing it?\",\"sections\":[{\"title\":\"Data Retention\",\"items\":[\"We will retain your personal data only for as long as such information is necessary for the purposes it was collected for. The retention period for personal data may also be affected by the requirements of applicable laws.\",\"In all cases information may be held for:\",\"a) a longer period where there is a legal or regulatory reason to do so (in which case it will be deleted once no longer required for the legal or regulatory purpose)\",\"b) a shorter period where the individual objects to the processing of their personal data\"]},{\"title\":\"Consequences of not providing personal data\",\"isIntro\":true},{\"title\":\"We may require collection of certain personal data about you and failure to provide such information may:\",\"items\":[\"result in us being unable to process your application and/or provide you with our services\",\"result in us being unable to respond to your requests on our products/services\",\"limit or prevent access to certain features on our website/weblinks\",\"result in us being unable to up
